<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Console</title>
  <!-- Fuentes bundleadas localmente (ver fonts.css). No precargamos con <link preload>:
       en file:// el credentials-mode del preload no matchea el fetch del @font-face y el
       recurso se baja al pedo. La carga se garantiza desde el renderer (ensureFontsReady
       espera document.fonts antes de crear la shell 1). -->
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
  <!-- Strop design tokens: vendored copy of @strop/tokens. Must load before styles.css,
       whose :root now aliases these (--cyan → var(--st-accent), …). -->
  <link rel="stylesheet" href="strop-tokens.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- TITLEBAR -->
    <div id="titlebar">
      <div class="brand">CONSOLE</div>
      <div id="tabs"></div>
      <div class="new-tab" id="new-tab" title="New tab (Ctrl+Shift+T)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </div>
      <div class="win-controls">
        <div class="win-btn" id="win-min" title="Minimize"><svg width="13" height="13" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6"><line x1="5" y1="12" x2="19" y2="12"></line></svg></div>
        <div class="win-btn close" id="win-close" title="Close"><svg width="13" height="13" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></div>
      </div>
    </div>

    <!-- BODY -->
    <div id="body">
      <!-- SIDEBAR -->
      <div id="sidebar">
        <div class="side-icon active" title="Sessions" data-view="sessions">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
        </div>
        <div class="side-icon" title="Snippets" data-view="snippets">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
        </div>
        <div class="side-icon" title="History" data-view="history">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"></path><path d="M3.05 13A9 9 0 106 5.3L3 8"></path><path d="M12 7v5l4 2"></path></svg>
        </div>
        <div class="spacer"></div>
        <div class="side-icon" title="Command palette" id="open-palette">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.05" y2="16.05"></line></svg>
        </div>
      </div>

      <!-- MAIN COLUMN -->
      <div id="main">
        <div id="terminal-container"></div>

        <!-- SNIPPETS PANEL -->
        <div id="snippets-panel" class="side-panel hidden">
          <div class="panel-header">
            <span class="panel-title"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg> Snippets</span>
            <button class="panel-close" title="Back to terminal"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
          </div>
          <div class="panel-body">
            <div class="snippet-add">
              <input type="text" id="snippet-name" class="panel-input" placeholder="Snippet name…" />
              <textarea id="snippet-cmd" class="panel-input panel-textarea" placeholder="Command or text block…"></textarea>
              <button id="snippet-save" class="panel-btn">+ Save snippet</button>
            </div>
            <div id="snippet-list" class="panel-list"></div>
          </div>
        </div>

        <!-- HISTORY PANEL -->
        <div id="history-panel" class="side-panel hidden">
          <div class="panel-header">
            <span class="panel-title"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> History</span>
            <div class="panel-actions">
              <button id="history-clear" class="panel-btn-sm">Clear</button>
              <button class="panel-close" title="Back to terminal"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
            </div>
          </div>
          <div class="panel-body">
            <div id="history-list" class="panel-list"></div>
          </div>
        </div>

        <!-- STATUS BAR -->
        <div id="status-bar">
          <span class="cwd" id="status-cwd">~</span>
          <span class="branch" id="status-branch"></span>
          <div class="spacer"></div>
          <span class="shell" id="status-shell">zsh</span>
          <span class="time" id="status-time"></span>
          <span class="exit" id="status-exit"></span>
        </div>
      </div>
    </div>

    <!-- COMMAND PALETTE -->
    <div id="palette-overlay" class="hidden">
      <div id="palette">
        <input type="text" id="palette-input" placeholder="Type a command or search…" />
        <div id="palette-results"></div>
      </div>
    </div>

    <!-- UPDATE TOAST (auto-update) — se rellena desde renderer.js -->
    <div id="update-toast" aria-live="polite"></div>

    <!-- CRT SCANLINES OVERLAY -->
    <div id="crt-overlay"></div>
  </div>

  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="../../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
